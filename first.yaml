name: shell commands # name of the workflow
    on: - push   #events that trigger the workflow
    jobs: # what are thge jobs
        - run-shell-commands   # the name of the job
        - runs-on: ubuntu-latest # where does this particular job run? # ubuntu
        steps:
          - name: Checkout #the name of the first step
            uses: actions/checkout@v1
          - name: Set Terraform  # the name of the next step
            uses: hashicorp/setup-terraform@v2 # it has downloaded and installed terraform 
            with:
              terraform_version: 1.1.9 
          - name: Terraform init  # it has been successfully initialized 
            run: terraform init 
          - name: Terraform validate 
            run: terraform validate 
          - name: echo string 
             run: echo "Hello"
          - name: Multi line string 

             run: | # using the pipe operator to pass multiple commands 
                pwd
                node -v 
                ls -a 

          - name: python command 
            run: |
             import platform 
             print(platform.processor())
            shell: python 
